    <script>


        function getUrlParam(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
            var r = window.location.search.substr(1).match(reg); //匹配目标参数
            if (r != null) return decodeURIComponent(r[2]);
            return null; //返回参数值
        }
        function searchArticle () {
            var kbUid = getUrlParam("kbUid")
            var content = getUrlParam("content")
            console.log("kbUid:", kbUid);
            console.log("content:", content);
            $.ajax({
                url: "http://127.0.0.1:9003/visitor/api/v1/article/search",
                type: "get",
                data: {
                    kbUid: kbUid,
                    title: content,
                    content: content,
                    categoryUid: '',
                    pageNumber: 0,
                    pageSize: 20,
                    client: 'web'
                },
                success:function(response){
                    console.log("search article success:", response);
                    if (response.code === 200) {
                        if (response.data.content.length == 0) {
                            // 搜索结果为空
                            $("#supportSearchArticle").append("未找到结果");
                        } else {
                            // 搜索结果不为空
                            for (var i = 0; i < response.data.content.length; i++) {
                                var article = response.data.content[i];
                                $("#supportSearchArticle").append("<li><a href='/helpcenter/df_org_uid_df_kb_hc_uid/article/" + article.uid + ".html' target='_blank'>" + article.title + "</a></li>");
                            }
                        }
                    } else {
                        alert(response.message);
                    }
                },
                error: function(error) {
                    console.log("search article detail error:", error);
                }
            });
        }
        searchArticle()
    </script>
